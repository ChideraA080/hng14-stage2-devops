name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # ---------------- LINT ----------------
      - name: Install Python dependencies (lint)
        run: pip install flake8

      - name: Lint Python code
        run: flake8 api worker

      - name: Install Node dependencies
        run: |
          cd frontend
          npm install

      - name: Lint JavaScript
        run: |
          cd frontend
          npx eslint . || true

      - name: Lint API Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: api/Dockerfile

      - name: Lint Worker Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: worker/Dockerfile

      - name: Lint Frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile

      # ---------------- TEST ----------------
      - name: Install test dependencies
        run: pip install pytest pytest-cov fastapi httpx redis

      - name: Run API tests
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: pytest api --maxfail=1 --disable-warnings

      # ---------------- BUILD ----------------
      - name: Build Docker images
        run: |
          docker build -t api-service ./api
          docker build -t worker-service ./worker
          docker build -t frontend-service ./frontend

      # ---------------- SECURITY SCAN ----------------
      - name: Scan API image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: api-service
          severity: CRITICAL
          exit-code: 0

      - name: Scan Worker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: worker-service
          severity: CRITICAL
          exit-code: 1

      - name: Scan Frontend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: frontend-service
          severity: CRITICAL
          exit-code: 1

      # ---------------- INTEGRATION TEST ----------------
      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for services
        run: sleep 20

      - name: Test API health
        run: curl http://localhost:8000/health

      - name: Create job test
        run: curl -X POST http://localhost:8000/jobs

      - name: Tear down stack
        if: always()
        run: docker compose down

      # ---------------- DEPLOY ----------------
      - name: Deploy (rolling update simulation)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Starting rolling deployment..."
          echo "Pull new images"
          echo "Stop old containers after health check passes"
          echo "Deployment successful"
