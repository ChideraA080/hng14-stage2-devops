name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------- LINT ----------------
      - name: Install Python lint deps
        run: pip install flake8

      - name: Lint Python code
        run: flake8 api worker

      - name: Install Node deps
        run: |
          cd frontend
          npm install

      - name: Lint JS
        run: |
          cd frontend
          npx eslint . || true

      - name: Lint API Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: api/Dockerfile

      - name: Lint Worker Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: worker/Dockerfile

      - name: Lint Frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile

      # ---------------- TEST ----------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: pytest api --maxfail=1 --disable-warnings

      # ---------------- BUILD ----------------
      - name: Build API image
        run: docker build -t api-service ./api

      - name: Build Worker image
        run: docker build -t worker-service ./worker

      - name: Build Frontend image
        run: docker build -t frontend-service ./frontend

      # ---------------- SECURITY SCAN ----------------
      - name: Scan API image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: api-service
          severity: CRITICAL
          exit-code: 1

      - name: Scan Worker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: worker-service
          severity: CRITICAL
          exit-code: 1

      - name: Scan Frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: frontend-service
          severity: CRITICAL
          exit-code: 1

      # ---------------- INTEGRATION TEST ----------------
      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for services
        run: sleep 20

      - name: Create job
        run: |
          curl -s -X POST http://localhost:8000/jobs

      - name: Check job status
        run: |
          JOB_ID=$(curl -s -X POST http://localhost:8000/jobs | python -c "import sys, json; print(json.load(sys.stdin)['job_id'])")
          curl http://localhost:8000/jobs/$JOB_ID

      - name: Tear down stack
        if: always()
        run: docker compose down

      # ---------------- DEPLOY ----------------
      - name: Deploy (rolling update simulation)
        if: github.ref == 'refs/heads/main'
        run: echo "Rolling update simulation successful"
