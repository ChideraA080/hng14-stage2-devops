name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379

      registry:
        image: registry:2
        ports:
          - 5000:5000

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # ---------------- LINT ----------------
      - name: Install Python dependencies (lint)
        run: pip install flake8

      - name: Lint Python code
        run: flake8 api worker

      - name: Install Node dependencies
        run: |
          cd frontend
          npm install

      - name: Lint JavaScript
        run: |
          cd frontend
          npx eslint . || true

      - name: Lint API Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: api/Dockerfile

      - name: Lint Worker Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: worker/Dockerfile

      - name: Lint Frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile

      # ---------------- TEST ----------------
      - name: Install test dependencies
        run: pip install pytest pytest-cov fastapi httpx redis

      - name: Run API tests
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: pytest api --maxfail=1 --disable-warnings

      # ---------------- BUILD ----------------
      - name: Build Docker images
        run: |
          docker build -t localhost:5000/api-service:latest \
                       -t localhost:5000/api-service:${{ github.sha }} ./api

          docker build -t localhost:5000/worker-service:latest \
                       -t localhost:5000/worker-service:${{ github.sha }} ./worker

          docker build -t localhost:5000/frontend-service:latest \
                       -t localhost:5000/frontend-service:${{ github.sha }} ./frontend

      # ---------------- PUSH ----------------
      - name: Push images to local registry
        run: |
          docker push localhost:5000/api-service:latest
          docker push localhost:5000/api-service:${{ github.sha }}

          docker push localhost:5000/worker-service:latest
          docker push localhost:5000/worker-service:${{ github.sha }}

          docker push localhost:5000/frontend-service:latest
          docker push localhost:5000/frontend-service:${{ github.sha }}

      # ---------------- SECURITY SCAN (SARIF FIXED) ----------------
      - name: Scan API image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: localhost:5000/api-service:latest
          format: sarif
          output: trivy-api.sarif
          severity: CRITICAL
          exit-code: 1

      - name: Scan Worker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: localhost:5000/worker-service:latest
          format: sarif
          output: trivy-worker.sarif
          severity: CRITICAL
          exit-code: 1

      - name: Scan Frontend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: localhost:5000/frontend-service:latest
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL
          exit-code: 1

      - name: Upload SARIF reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif-reports
          path: trivy-*.sarif

      # ---------------- INTEGRATION TEST ----------------
      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for services
        run: sleep 20

      - name: Create job test + poll until completion
        run: |
          JOB_RESPONSE=$(curl -s -X POST http://localhost:8000/jobs)
          JOB_ID=$(echo $JOB_RESPONSE | python3 -c "import sys, json; print(json.load(sys.stdin)['job_id'])")

          echo "Job ID: $JOB_ID"

          for i in {1..15}; do
            STATUS=$(curl -s http://localhost:8000/jobs/$JOB_ID | python3 -c "import sys, json; print(json.load(sys.stdin).get('status'))")
            echo "Attempt $i: $STATUS"

            if [ "$STATUS" = "completed" ]; then
              echo "Job completed successfully"
              exit 0
            fi

            sleep 2
          done

          echo "Job did not complete in time"
          exit 1

      - name: Tear down stack
        if: always()
        run: docker compose down -v

      # ---------------- DEPLOY ----------------
      - name: Deploy (rolling update simulation)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Starting rolling deployment..."
          echo "Pull new images"
          echo "Stop old containers after health check passes"
          echo "Deployment successful"
