name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:

env:
  REGISTRY: localhost:5000
  IMAGE_TAG: ${{ github.sha }}

jobs:
  pipeline:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379

      registry:
        image: registry:2
        ports:
          - 5000:5000

    steps:

    # ---------------- CHECKOUT ----------------
    - name: Checkout code
      uses: actions/checkout@v4

    # ---------------- LINT ----------------
    - name: Install Python lint tools
      run: pip install flake8

    - name: Lint Python
      run: flake8 api worker

    - name: Install Node dependencies
      run: |
        cd frontend
        npm install

    - name: Lint JS
      run: |
        cd frontend
        npx eslint .

    - name: Lint Dockerfiles
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: |
          api/Dockerfile
          worker/Dockerfile
          frontend/Dockerfile

    # ---------------- TEST ----------------
    - name: Install test dependencies
      run: pip install pytest pytest-cov fastapi httpx redis

    - name: Run API tests
      run: |
        pytest api \
          --maxfail=1 \
          --disable-warnings \
          --cov=api \
          --cov-report=xml

    - name: Upload coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml

    # ---------------- BUILD ----------------
    - name: Build images (SHA + latest)
      run: |
        docker build -t $REGISTRY/api-service:latest -t $REGISTRY/api-service:$IMAGE_TAG ./api
        docker build -t $REGISTRY/worker-service:latest -t $REGISTRY/worker-service:$IMAGE_TAG ./worker
        docker build -t $REGISTRY/frontend-service:latest -t $REGISTRY/frontend-service:$IMAGE_TAG ./frontend

    # ---------------- PUSH ----------------
    - name: Push images
      run: |
        docker push $REGISTRY/api-service:latest
        docker push $REGISTRY/api-service:$IMAGE_TAG

        docker push $REGISTRY/worker-service:latest
        docker push $REGISTRY/worker-service:$IMAGE_TAG

        docker push $REGISTRY/frontend-service:latest
        docker push $REGISTRY/frontend-service:$IMAGE_TAG

    # ---------------- SECURITY SCAN (FIXED) ----------------
    - name: Run Trivy scan (single optimized step)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/api-service:latest
        format: sarif
        output: trivy.sarif
        severity: CRITICAL
        ignore-unfixed: true
        exit-code: 1

    - name: Upload Trivy report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: trivy-report
        path: trivy.sarif

    # ---------------- INTEGRATION TEST (FIXED) ----------------
    - name: Start stack
      run: docker compose up -d --build

    - name: Wait for API health (robust)
      run: |
        for i in {1..30}; do
          curl -f http://localhost:8000/health && exit 0
          echo "waiting..."
          sleep 3
        done
        exit 1

    - name: Run integration test
      run: |
        JOB=$(curl -s -X POST http://localhost:8000/jobs)
        JOB_ID=$(echo $JOB | python3 -c "import sys,json; print(json.load(sys.stdin)['job_id'])")

        for i in {1..20}; do
          STATUS=$(curl -s http://localhost:8000/jobs/$JOB_ID | python3 -c "import sys,json; print(json.load(sys.stdin).get('status'))")

          if [ "$STATUS" = "completed" ]; then
            echo "SUCCESS"
            exit 0
          fi

          sleep 3
        done

        exit 1

    - name: Tear down stack
      if: always()
      run: docker compose down -v

    # ---------------- DEPLOY (FIXED) ----------------
    - name: Deploy (main only)
      if: github.ref == 'refs/heads/main'
      run: |
        echo "Deploying version: $IMAGE_TAG"

        docker compose down
        IMAGE_TAG=$IMAGE_TAG docker compose up -d

        timeout 60 bash -c '
          until curl -f http://localhost:8000/health; do
            echo "waiting..."
            sleep 5
          done
        '

        echo "Deployment successful"
