name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:

env:
  REGISTRY: localhost:5000
  IMAGE_TAG: ${{ github.sha }}

jobs:
  pipeline:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379

      registry:
        image: registry:2
        ports:
          - 5000:5000

    steps:

    # ---------------- CHECKOUT ----------------
    - name: Checkout code
      uses: actions/checkout@v4

    # ---------------- LINT (PYTHON) ----------------
    - name: Install Python lint tools
      run: pip install flake8

    - name: Lint Python code
      run: flake8 api worker

    # ---------------- LINT (JS) ----------------
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm install

    - name: Lint JavaScript
      run: |
        cd frontend
        npx eslint .

    # ---------------- HADOLINT ----------------
    - name: Lint API Dockerfile
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: ./api/Dockerfile
        failure-threshold: warning
        ignore: DL3008

    - name: Lint Worker Dockerfile
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: ./worker/Dockerfile
        failure-threshold: warning
        ignore: DL3008

    - name: Lint Frontend Dockerfile
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: ./frontend/Dockerfile
        failure-threshold: warning
        ignore: DL3008
    # ---------------- TEST ----------------
    - name: Install test dependencies
      run: pip install pytest pytest-cov fastapi httpx redis

    - name: Run API tests
      env:
        REDIS_HOST: localhost
        REDIS_PORT: 6379
      run: |
        pytest api \
          --maxfail=1 \
          --disable-warnings \
          --cov=api \
          --cov-report=xml

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml

    # ---------------- BUILD (LATEST + SHA) ----------------
    - name: Build Docker images
      run: |
        echo "Building images with latest + SHA"

        docker build -t $REGISTRY/api-service:latest -t $REGISTRY/api-service:$IMAGE_TAG ./api
        docker build -t $REGISTRY/worker-service:latest -t $REGISTRY/worker-service:$IMAGE_TAG ./worker
        docker build -t $REGISTRY/frontend-service:latest -t $REGISTRY/frontend-service:$IMAGE_TAG ./frontend

    # ---------------- PUSH ----------------
    - name: Push Docker images
      run: |
        docker push $REGISTRY/api-service:latest
        docker push $REGISTRY/api-service:$IMAGE_TAG

        docker push $REGISTRY/worker-service:latest
        docker push $REGISTRY/worker-service:$IMAGE_TAG

        docker push $REGISTRY/frontend-service:latest
        docker push $REGISTRY/frontend-service:$IMAGE_TAG

    # ---------------- SECURITY SCAN (STAGE 2 COMPLIANT) ----------------

    - name: Trivy scan API
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/api-service:latest
        format: sarif
        output: trivy-api.sarif
        severity: CRITICAL
        ignore-unfixed: true
        scanners: vuln
        exit-code: 1

    - name: Trivy scan Worker
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/worker-service:latest
        format: sarif
        output: trivy-worker.sarif
        severity: CRITICAL
        ignore-unfixed: true
        scanners: vuln
        exit-code: 1

    - name: Trivy scan Frontend
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/frontend-service:latest
        format: sarif
        output: trivy-frontend.sarif
        severity: CRITICAL
        ignore-unfixed: true
        scanners: vuln
        exit-code: 1

    - name: Upload Trivy SARIF reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: trivy-sarif-reports
        path: |
          trivy-api.sarif
          trivy-worker.sarif
          trivy-frontend.sarif

    # ---------------- INTEGRATION TEST ----------------
    - name: Start stack
      run: docker compose up -d --build

    - name: Wait for API health
      run: |
        for i in {1..30}; do
          curl -f http://localhost:8000/health && exit 0
          echo "waiting..."
          sleep 3
        done
        exit 1

    - name: Integration test
      run: |
        JOB=$(curl -s -X POST http://localhost:8000/jobs)

        JOB_ID=$(echo $JOB | python3 -c "import sys,json; print(json.load(sys.stdin)['job_id'])")

        for i in {1..20}; do
          STATUS=$(curl -s http://localhost:8000/jobs/$JOB_ID | python3 -c "import sys,json; print(json.load(sys.stdin).get('status'))")

          echo "status=$STATUS"

          if [ "$STATUS" = "completed" ]; then
            echo "SUCCESS"
            exit 0
          fi

          sleep 3
        done

        exit 1

    - name: Tear down stack
      if: always()
      run: docker compose down -v

    # ---------------- DEPLOY ----------------
    - name: Deploy (main only)
      if: github.ref == 'refs/heads/main'
      run: |
        echo "Deploying version: $IMAGE_TAG"

        docker compose down
        IMAGE_TAG=$IMAGE_TAG docker compose up -d

        timeout 60 bash -c '
          until curl -f http://localhost:8000/health; do
            echo "waiting..."
            sleep 5
          done
        '

        echo "Deployment successful"
