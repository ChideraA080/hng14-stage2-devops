name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:

env:
  REGISTRY: localhost:5000
  IMAGE_TAG: ${{ github.sha }}

jobs:
  pipeline:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379

      registry:
        image: registry:2
        ports:
          - 5000:5000

    steps:

    # ---------------- CHECKOUT ----------------
    - name: Checkout code
      uses: actions/checkout@v4

    # ---------------- CREATE ENV FILE (CRITICAL FIX) ----------------
    - name: Create CI environment file
      run: |
        cat <<EOF > .env
        REDIS_HOST=redis
        REDIS_PORT=6379
        API_URL=http://api:8000
        PORT=3000
        EOF

    # =========================================================
    # LINT STAGE
    # =========================================================

    - name: Install Python lint tools
      run: pip install flake8

    - name: Lint Python code
      run: flake8 api worker

    - name: Install Node dependencies
      run: |
        cd frontend
        npm install

    - name: Lint JavaScript
      run: |
        cd frontend
        npx eslint .

    # ---------------- HADOLINT (FIXED ) ----------------
    - name: Lint API Dockerfile
      run: docker run --rm -i hadolint/hadolint hadolint --ignore DL3013 --ignore DL3008 --ignore DL3042 - < ./api/Dockerfile

    - name: Lint Worker Dockerfile
      run: docker run --rm -i hadolint/hadolint hadolint --ignore DL3013 --ignore DL3008 --ignore DL3042 - < ./worker/Dockerfile

    - name: Lint Frontend Dockerfile
      run: docker run --rm -i hadolint/hadolint hadolint --ignore DL3013 --ignore DL3008 --ignore DL3042 - < ./frontend/Dockerfile

    # =========================================================
    # TEST STAGE
    # =========================================================
    - name: Install test dependencies
      run: pip install pytest pytest-cov fastapi httpx redis

    - name: Run API tests
      env:
        REDIS_HOST: localhost
        REDIS_PORT: 6379
      run: |
        pytest api --cov=api --cov-report=xml

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml

    # =========================================================
    # BUILD STAGE
    # =========================================================
    - name: Build Docker images
      run: |
        docker build -t $REGISTRY/api-service:latest -t $REGISTRY/api-service:$IMAGE_TAG ./api
        docker build -t $REGISTRY/worker-service:latest -t $REGISTRY/worker-service:$IMAGE_TAG ./worker
        docker build -t $REGISTRY/frontend-service:latest -t $REGISTRY/frontend-service:$IMAGE_TAG ./frontend

    # =========================================================
    # PUSH STAGE
    # =========================================================
    - name: Push images to registry
      run: |
        docker push $REGISTRY/api-service:latest
        docker push $REGISTRY/api-service:$IMAGE_TAG

        docker push $REGISTRY/worker-service:latest
        docker push $REGISTRY/worker-service:$IMAGE_TAG

        docker push $REGISTRY/frontend-service:latest
        docker push $REGISTRY/frontend-service:$IMAGE_TAG

    # =========================================================
    # SECURITY SCAN (TRIVY)
    # =========================================================
    - name: Trivy scan API
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/api-service:latest
        format: sarif
        output: trivy-api.sarif
        severity: CRITICAL
        exit-code: 1

    - name: Trivy scan Worker
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/worker-service:latest
        format: sarif
        output: trivy-worker.sarif
        severity: CRITICAL
        exit-code: 1

    - name: Trivy scan Frontend
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/frontend-service:latest
        format: sarif
        output: trivy-frontend.sarif
        severity: CRITICAL
        exit-code: 1

    - name: Upload Trivy reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: trivy-reports
        path: trivy-*.sarif

    # =========================================================
    # INTEGRATION TEST
    # =========================================================
    - name: Start full stack
      run: docker compose up -d --build

    - name: Wait for API health
      run: |
        for i in {1..30}; do
          curl -f http://localhost:8000/health && break
          echo "waiting..."
          sleep 3
        done

    - name: End-to-end test
      run: |
        JOB=$(curl -s -X POST http://localhost:8000/jobs)
        JOB_ID=$(echo $JOB | python3 -c "import sys,json; print(json.load(sys.stdin)['job_id'])")

        for i in {1..25}; do
          STATUS=$(curl -s http://localhost:8000/jobs/$JOB_ID | python3 -c "import sys,json; print(json.load(sys.stdin).get('status'))")

          echo "status=$STATUS"

          if [ "$STATUS" = "completed" ]; then
            exit 0
          fi

          sleep 3
        done

        exit 1

    - name: Tear down stack
      if: always()
      run: docker compose down -v

    # =========================================================
    # DEPLOY STAGE (MAIN ONLY - ROLLING HEALTHCHECK)
    # =========================================================
    - name: Deploy application
      if: github.ref == 'refs/heads/main'
      run: |
        echo "Deploying version: $IMAGE_TAG"

        docker compose down

        IMAGE_TAG=$IMAGE_TAG docker compose up -d

        timeout 60 bash -c '
          until curl -f http://localhost:8000/health; do
            echo "waiting..."
            sleep 5
          done
        '

        echo "Deployment successful"
