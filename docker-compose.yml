services:
  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    networks:
      - hng-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "128M"

  api:
    build:
      context: ./api
    container_name: api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hng-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"

  worker:
    build:
      context: ./worker
    container_name: worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - hng-net
    healthcheck:
      test: ["CMD", "python", "-c", "print('worker ok')"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      API_URL: ${API_URL}
      PORT: ${PORT}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hng-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"

networks:
  hng-net:
    driver: bridge
